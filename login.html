<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | NutriTec</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body.login-page {
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #FFF3E6 0%, #FFE8D1 45%, #F5E6D8 100%);
      font-family: 'Poppins', sans-serif;
      padding: 1.25rem;
    }
    .login-card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(61, 44, 30, 0.12);
      width: 100%;
      max-width: 400px;
      padding: 2rem 1.75rem 1.75rem;
      text-align: center;
    }
    .login-mascot {
      width: 110px;
      height: 110px;
      object-fit: contain;
      margin: 0 auto 0.75rem;
      display: block;
      filter: drop-shadow(0 8px 16px rgba(196, 92, 38, 0.2));
    }
    .login-card h1 {
      font-family: 'Nunito', sans-serif;
      font-size: 1.75rem;
      color: #1B5E20;
      margin: 0 0 0.35rem;
    }
    .login-card .subtitle {
      color: #7A6555;
      font-size: 0.92rem;
      margin: 0 0 1.5rem;
      line-height: 1.45;
    }
    .login-form {
      text-align: left;
    }
    .login-form label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: #3D2C1E;
      margin-bottom: 0.35rem;
    }
    .login-form input {
      width: 100%;
      padding: 0.75rem 0.9rem;
      border: 2px solid #F0E0D0;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.95rem;
      margin-bottom: 1rem;
      box-sizing: border-box;
      transition: border-color 0.2s;
      background: #FFFBF7;
    }
    .login-form input:focus {
      outline: none;
      border-color: #2E7D32;
    }
    .login-form .btn-login {
      width: 100%;
      padding: 0.85rem;
      border: none;
      border-radius: 50px;
      background: #2E7D32;
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 4px 15px rgba(196, 92, 38, 0.35);
      transition: background 0.2s, transform 0.2s;
      margin-top: 0.25rem;
    }
    .login-form .btn-login:hover {
      background: #1B5E20;
      transform: translateY(-1px);
    }
    .login-error {
      display: none;
      background: #FFEBEE;
      color: #C62828;
      padding: 0.65rem 0.85rem;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      text-align: center;
    }
    .login-error.show { display: block; }
    .login-hint {
      margin-top: 1.25rem;
      font-size: 0.8rem;
      color: #7A6555;
      line-height: 1.4;
    }
    .login-hint code {
      background: #FFF3E6;
      padding: 0.15rem 0.4rem;
      border-radius: 6px;
      font-size: 0.78rem;
    }
    .login-footer {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: #9A8575;
    }
  </style>
</head>

    <h1>NutriTec</h1>
    <p class="subtitle">Entre para acessar o guia de receitas adaptadas para a alimentação infantil.</p>

    <div class="login-error" id="loginError">E-mail ou senha incorretos. Tente novamente.</div>

    <form class="login-form" id="loginForm" autocomplete="on">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" placeholder="seu@email.com" required>

      <label for="password">Senha</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required minlength="4">

      <button type="submit" class="btn-login">Entrar</button>
    </form>

    <p class="login-hint">
      <strong>Demo do projeto:</strong><br>
      E-mail: <code>pai@nutritec.com</code><br>
      Senha: <code>1234</code>
    </p>
    <p class="login-footer">CEEP Pedro Boaretto Neto · Cascavel/PR</p>
  </div>

  <script>
    // Se já estiver logado, vai direto para o site
    if (localStorage.getItem('nutritec_user')) {
      window.location.href = 'index.html';
    }

    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      const error = document.getElementById('loginError');

      // Login demonstrativo (projeto escolar / GitHub Pages sem backend)
      const usuarios = [
        { email: 'pai@nutritec.com', senha: '1234', nome: 'Responsável' },
        { email: 'admin@nutritec.com', senha: 'admin', nome: 'Admin' },
        { email: 'demo@nutritec.com', senha: 'demo', nome: 'Demo' }
      ];

      const user = usuarios.find(u => u.email === email && u.senha === password);

      if (user) {
        localStorage.setItem('nutritec_user', JSON.stringify({
          email: user.email,
          nome: user.nome,
          loginAt: new Date().toISOString()
        }));
        window.location.href = 'index.html';
      } else {
        error.classList.add('show');
      }
    });
  </script>
